spring.application.name=techstore
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/techstore}
spring.datasource.username=${DB_USER:techstore}
spring.datasource.password=${DB_PASSWORD:techstore_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.address=127.0.0.1
server.port=${PORT:8080}
server.error.include-message=never

# Документация REST API.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.techstore.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.persist-authorization=false
springdoc.override-with-generic-response=false

logging.file.name=logs/techstore.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
